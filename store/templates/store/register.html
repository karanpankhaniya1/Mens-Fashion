{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Men's Fashion Store</title>

    <style>
        /* ---------- Global ---------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* ---------- Header ---------- */

        .header {
            width: 100%;
            background: #111;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #d4af37;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        .header a:hover {
            color: #d4af37;
        }

        /* ---------- Register Container ---------- */

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
        }

        /* ---------- Register Card ---------- */

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .auth-card .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        /* ---------- Form ---------- */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #111;
        }

        /* ---------- Register Button ---------- */

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 5px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #d4af37;
            color: #111;
        }

        /* ---------- Account Link ---------- */

        .auth-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            line-height: 1.6;
        }

        .auth-link a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
        }

        .auth-link a:hover {
            color: #d4af37;
        }

        /* ---------- Messages ---------- */

        .message {
            background: #ffe8e8;
            color: #b00020;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* ---------- Responsive ---------- */

        @media (max-width: 600px) {

            .header {
                padding: 18px 5%;
            }

            .logo {
                font-size: 20px;
            }

            .header a {
                margin-left: 10px;
                font-size: 14px;
            }

            .container {
                width: 92%;
                margin-top: 30px;
            }

            .auth-card {
                padding: 25px;
            }

            .auth-card h1 {
                font-size: 25px;
            }
        }
    </style>

</head>

<body>

    <!-- Header -->

    <header class="header">

        <div class="logo">
            MEN<span>STYLE</span>
        </div>

        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'login' %}">Login</a>
        </nav>

    </header>

    <!-- Register -->

    <main class="container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="subtitle">
                Join Men's Fashion Store
            </p>

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>

                <button type="submit" class="btn">
                    Create Account
                </button>

            </form>

            <p class="auth-link">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </p>

        </div>

    </main>

</body>

</html>
